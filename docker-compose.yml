version: '3.9'

services:

  mysql:
    image: mysql:8.4

    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
    
    env_file:
      - .env
    
    restart: unless-stopped


  backend:
    build:
      context: ./backend

    container_name: flask_api

    ports:
      - "5000:5000"

    depends_on:
      - mysql

    environment:
      DB_HOST: ${MYSQL_HOST}
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./backend:/app
    
    env_file:
      - .env

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: react_app

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    env_file:
      - .env
    
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

    restart: unless-stopped
volumes:
  mysql_data: